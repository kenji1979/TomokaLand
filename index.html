<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#78d9ff" />
    <title>ともかのくさいいき大ぼうけん</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="ともかのくさいいき大ぼうけん">
      <section class="game-frame">
        <canvas id="game" width="960" height="540" aria-label="ゲーム画面"></canvas>

        <div class="hud" aria-label="ゲーム情報">
          <div class="badge">スコア <span id="scoreText">0000</span></div>
          <div class="badge" id="statusText">ハート ♥♥♥</div>
          <div class="badge">くさい息 <span id="breathText">OK</span></div>
          <div class="badge">パワー <span id="powerText">ふつう</span></div>
          <label class="photo-button">
            写真
            <input id="photoInput" type="file" accept="image/*" />
          </label>
        </div>

        <p id="message" class="message">
          ともかの くさいいき大ぼうけん！
          <small>写真ボタンで主人公の顔を選んで、スタートを押してね。</small>
        </p>

        <div class="top-actions" aria-label="ゲーム操作">
          <button id="startButton" type="button" class="menu-button">スタート</button>
          <button id="pauseButton" type="button" class="menu-button">休けい</button>
          <button id="restartButton" type="button" class="menu-button">もう一回</button>
        </div>

        <div class="controls" aria-label="タッチ操作">
          <div class="control-group">
            <button class="control-button" type="button" data-action="left" aria-label="左へ移動">←</button>
            <button class="control-button" type="button" data-action="right" aria-label="右へ移動">→</button>
          </div>
          <div class="control-group">
            <button class="control-button action" type="button" data-action="jump" aria-label="ジャンプ">ジャンプ</button>
            <button class="control-button breath" type="button" data-action="breath" aria-label="くさい息">くさい息</button>
          </div>
        </div>

        <p class="hint">
          iPhone/iPadは下のボタンで操作。PCは ← → / A D、Spaceでジャンプ、X/Kでくさい息。
        </p>
      </section>
    </main>

    <script src="src/game.js" type="module"></script>
  </body>
</html>
